      - name: 提交并用 PAT 推送
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap.yml
          git add -A
          git status
          git commit -m "chore: bootstrap DroidDeck 汉化仓库 (DroidDeck-0.1.6)"
          echo "=== 验证 token ==="
          if [ -z "$GH_TOKEN" ]; then
            echo "❌ GH_TOKEN 为空！请在仓库 Settings -> Secrets and variables -> Actions 添加 GH_TOKEN"
            exit 1
          fi
          echo "✅ GH_TOKEN 已设置 (长度: ${#GH_TOKEN})"
          echo "=== 用 PAT 推送 ==="
          git remote set-url origin "https://$GH_TOKEN@github.com/${{ github.repository }}.git"
          git push origin main

      - name: 完成
        run: |
          echo "============================================"
          echo "  仓库初始化完成！基线: DroidDeck-0.1.6"
          echo "============================================"
          echo "  下一步：Actions -> Build Localized APK -> Run workflow"
