      - name: 提交并推送到 main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/bootstrap.yml
          git add -A
          echo "=== git status ==="
          git status
          echo "=== 提交 ==="
          git commit -m "chore: bootstrap SteamDeck 汉化仓库"
          echo "=== 推送到 main ==="
          git push origin main

      - name: 完成
        run: |
          echo "============================================"
          echo "  仓库初始化完成！"
          echo "============================================"
          echo ""
          echo "  下一步："
          echo "  1. 刷新仓库主页，确认文件已生成"
          echo "  2. Actions → Build Localized APK → Run workflow"
          echo "  3. 等待 3-5 分钟，Releases 出现汉化 APK"
