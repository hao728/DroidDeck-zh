name: Bootstrap Repository

# 自举工作流：上传此文件到空仓库后自动运行
# 功能：解码内置的完整仓库源码 → 解压 → 提交 → 推送 → 删除自身
# 使用方法：
#   1. 创建空 Private 仓库 steamdeck-zh（不初始化，默认分支 main）
#   2. 手机浏览器点 Add file → Upload files
#   3. 上传此文件 → Commit changes
#   4. Actions 自动运行，1分钟后完成

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 生成完整仓库源码
