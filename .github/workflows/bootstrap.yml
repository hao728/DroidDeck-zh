name: Bootstrap Repository

# 自举工作流：上传此文件到空仓库后自动运行
# 前置条件：仓库 Secrets 里添加 GH_TOKEN（Classic PAT，勾选 repo 权限）
# 功能：解码内置的完整仓库源码 -> 解压 -> 用 PAT 提交推送 -> 删除自身

on:
  push:
    paths:
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
