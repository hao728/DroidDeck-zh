name: Build Localized APK

# 每次 push patches/ 或 scripts/ 或 config/ 时自动构建并发布
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'config/**'
      - 'secrets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '上游版本号（留空使用 state/upstream-version）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate patches
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/validate-patches.sh "${{ inputs.version }}" || echo "::warning::部分补丁校验未通过，继续构建但可能有遗漏"

      - name: Build APK
        id: build
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/build.sh "${{ inputs.version }}"
          echo "apk_path=$(ls dist/*.apk | head -1)" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $(ls dist/*.apk | head -1))" >> "$GITHUB_OUTPUT"

      - name: Get version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(cat state/upstream-version)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${VER}-zh" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DroidDeck ${{ steps.ver.outputs.version }} 汉化版
          body: |
            ## DroidDeck ${{ steps.ver.outputs.version }} 汉化版

            基于上游 **${{ steps.ver.outputs.version }}**（ludashi 变体）自动构建。

            - **包名**: `com.droiddeck.launcher`
            - **签名**: 社区持久化密钥（`secrets/release.keystore`），同签名版本可覆盖安装
            - **补丁数**: $(find patches -type f | wc -l) 个文件
            - **构建方式**: GitHub Actions 自动构建

            ### 安装说明
            1. 如已安装原版 DroidDeck（签名不同），请先卸载再安装本汉化版
            2. 下载下方 APK 安装
            3. 系统语言设为简体中文，应用自动显示中文

            ### 开源声明
            本项目基于 [Winlator](https://github.com/brunodev85/winlator)（LGPL）与 [DroidDeck](https://github.com/The412Banner/winlator-contents) 修改，汉化补丁以相同协议开源。详见仓库 LICENSE。
          files: ${{ steps.build.outputs.apk_path }}
