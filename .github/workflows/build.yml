name: Build Localized APK

# 每次 push patches/ 或 scripts/ 或 config/ 时自动构建并发布
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'config/**'
      - 'secrets/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '上游版本号（留空使用 state/upstream-version）'
        required: false
        default: ''
      prerelease:
        description: '预发布版（不稳定/未验证版本保持勾选；确认稳定可用后取消勾选，以发布为最新版）'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          # ubuntu-latest runner 已预装 Android SDK，直接使用，避免 setup-android@v3 的 sdkmanager tools 报错
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "可用 build-tools:"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "(未找到)"

      - name: Validate patches
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/validate-patches.sh "${{ inputs.version }}" || echo "::warning::部分补丁校验未通过，继续构建但可能有遗漏"

      - name: Build APK
        id: build
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/build.sh "${{ inputs.version }}"
          echo "apk_path=$(ls dist/*.apk | head -1)" >> "$GITHUB_OUTPUT"
          echo "apk_name=$(basename $(ls dist/*.apk | head -1))" >> "$GITHUB_OUTPUT"

      - name: Lint translations & APK
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/lint-translations.sh "${{ steps.build.outputs.apk_path }}"

      - name: Get version
        id: ver
        run: |
          VER="${{ inputs.version }}"
          if [ -z "$VER" ]; then
            VER=$(cat state/upstream-version)
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=${VER}-zh" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: DroidDeck ${{ steps.ver.outputs.version }} 汉化版
          # push 触发一律为预发布；手动触发时 prerelease 勾选为预发布，取消勾选为正式版
          prerelease: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease == true }}
          make_latest: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease == false }}
          body: |
            ## DroidDeck 汉化版 ${{ steps.ver.outputs.version }}

            > 基于上游 **${{ steps.ver.outputs.version }}**（ludashi 变体）深度汉化，自动构建发布。

            ### 汉化特性

            - **深度汉化**：资源字符串（合并上游已有 83 条翻译）+ smali 硬编码 UI 字符串（300+ 条设置项、状态提示、错误信息）
            - **竖屏适配**：启动器、文件管理器等界面支持自动旋转；桌面会话保持横屏
            - **中文应用名**：「DroidDeck 汉化版」
            - **汉化来源声明**：应用内关于页已注入汉化仓库地址与免责声明

            ### 基本信息

            - **包名**: `com.droiddeck.launcher`
            - **签名**: 社区持久化密钥，同签名版本可覆盖安装
            - **构建方式**: GitHub Actions 全自动构建 + 汉化质量校验
            - **发布类型**: ${{ github.event_name != 'workflow_dispatch' || inputs.prerelease == true && '预发布版（prerelease）— 尚未充分验证，稳定版请手动触发并取消勾选预发布' || '正式版（latest）— 已验证可用' }}

            ### 安装说明

            1. 如已安装原版 DroidDeck（签名不同），请先卸载再安装本汉化版
            2. 下载下方 APK 安装
            3. 系统语言设为简体中文，应用自动显示中文；smali 硬编码字符串已直接汉化

            ### 免责声明

            本汉化版仅供学习交流使用，请勿用于商业用途。基于 Winlator（LGPL）与 DroidDeck 修改，汉化补丁以 LGPL-3.0 开源。汉化来源：[github.com/hao728/steamdeck-zh](https://github.com/hao728/steamdeck-zh)
          files: ${{ steps.build.outputs.apk_path }}
