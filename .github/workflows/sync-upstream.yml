name: Sync Upstream

# 每天检查上游新版本，有新版则自动同步并开Issue提醒
on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 0:00
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Run sync
        id: sync
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/sync-upstream.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit version update
        if: steps.sync.outputs.UP_TO_DATE == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/upstream-version UNTRANSLATED_REPORT.md
          git commit -m "chore: sync upstream ${{ steps.sync.outputs.NEW_VERSION }}" || echo "nothing to commit"
          git push

      - name: Create issue for new version
        if: steps.sync.outputs.UP_TO_DATE == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const version = process.env.NEW_VERSION;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[上游更新] ${version} 需要汉化检查`,
              body: `上游发布了新版本 **${version}**。\n\n请检查 UNTRANSLATED_REPORT.md，补全新增字符串后重新触发 Build 工作流。\n\n> 此 Issue 由 sync-upstream 工作流自动创建。`,
              labels: ['upstream-update', 'translation-needed']
            });
        env:
          NEW_VERSION: ${{ steps.sync.outputs.NEW_VERSION }}
