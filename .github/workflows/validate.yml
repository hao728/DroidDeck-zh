name: Validate Patches

# PR 时校验补丁有效性，防止合并失效的补丁
on:
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - 'config/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "可用 build-tools:"
          ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null || echo "(未找到)"

      - name: Validate
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh
          bash scripts/validate-patches.sh

      - name: Check XML well-formed
        run: |
          echo "检查 patches/ 中所有 XML 文件格式..."
          fail=0
          while IFS= read -r -d '' f; do
            if ! python3 -c "import xml.etree.ElementTree as ET; ET.parse('$f')" 2>/dev/null; then
              echo "::error::XML 格式错误: $f"
              fail=1
            fi
          done < <(find patches -name '*.xml' -print0)
          if [ "$fail" -eq 1 ]; then
            exit 1
          fi
          echo "所有 XML 文件格式正确"

      - name: Comment on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const patchCount = fs.readdirSync('patches', {recursive: true}).filter(f => f.endsWith('.xml') || f.endsWith('.smali')).length;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### 补丁校验结果\n\n- 补丁文件数: ${patchCount}\n- 校验状态: 通过 ✅\n\n> 由 validate-patches 工作流自动检查`
            });
